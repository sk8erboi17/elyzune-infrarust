[package]
name = "elyzune-via"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Protocol translator for Elyzune: 1.21.11, 26.1 and 26.3 clients on a 26.2 backend"
keywords = ["minecraft", "proxy", "plugin", "protocol"]
categories = ["game-development"]
publish = false

[lints]
workspace = true

[dependencies]
infrarust-api = { workspace = true }
bytes = { workspace = true }
memchr = "2.8"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
infrarust-api = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt"] }
